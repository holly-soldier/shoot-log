<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>射撃手簿</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary-color: #333;
            --bg-color: #f4f4f9;
        }
        body {
            margin: 0; padding: 0;
            font-family: sans-serif;
            background-color: var(--bg-color);
            display: flex; flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 10px 15px;
            display: flex; justify-content: space-between; align-items: center;
        }
        header h1 { margin: 0; font-size: 1.2rem; }
        
        /* 上部：Canvasエリア */
        #canvas-container {
            flex: 1; /* 画面の上半分〜半分強を占有 */
            position: relative;
            background-color: #fff;
            border-bottom: 2px solid #ccc;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%; height: 100%;
            touch-action: none; /* デフォルトのスクロールを無効化 */
        }
        
        /* ツールバー（ズームリセット等） */
        .canvas-tools {
            position: absolute; top: 10px; right: 10px;
            display: flex; gap: 5px;
        }
        button {
            padding: 8px 12px; border: 1px solid #ccc;
            background: #fff; border-radius: 4px; cursor: pointer;
        }
        
        /* 下部：操作・データエリア */
        #control-panel {
            flex: 1; /* 残りの下半分 */
            overflow-y: auto;
            padding: 15px;
            background-color: #fafafa;
        }
        
        .group-tabs {
            display: flex; gap: 10px; margin-bottom: 15px;
            overflow-x: auto;
        }
        .group-tab {
            padding: 10px 20px;
            background: #e0e0e0; border: none; border-radius: 20px;
            font-weight: bold; transition: 0.2s;
        }
        .group-tab.active {
            background: var(--primary-color); color: white;
        }
        
        .input-area {
            display: flex; gap: 10px; margin-bottom: 15px; align-items: center;
        }
        .input-area input {
            width: 60px; padding: 8px; border: 1px solid #ccc; border-radius: 4px;
        }
        
        .data-list {
            background: #fff; border: 1px solid #ddd;
            border-radius: 8px; padding: 10px;
        }
        .data-row {
            display: flex; justify-content: space-between;
            padding: 5px 0; border-bottom: 1px solid #eee;
        }
        .mpi-row {
            font-weight: bold; color: #d32f2f; margin-top: 10px; border-top: 2px solid #ddd; padding-top: 10px;
        }
    </style>
</head>
<body>

<header>
    <h1>射撃手簿 v0.1</h1>
    <div>
        <button id="btn-settings">設定</button>
    </div>
</header>

<div id="canvas-container">
    <canvas id="targetCanvas"></canvas>
    <div class="canvas-tools">
        <button id="btn-reset-view">視点リセット</button>
    </div>
</div>

<div id="control-panel">
    <div class="group-tabs" id="group-tabs-container">
        </div>
    
    <div class="input-area">
        <label>X(cm): <input type="number" id="input-x" step="0.1"></label>
        <label>Y(cm): <input type="number" id="input-y" step="0.1"></label>
        <button id="btn-add-shot">追加</button>
    </div>

    <div class="data-list" id="data-list-container">
        </div>
</div>

<script>
    // --- データ構造 ---
    let sessionData = {
        id: "session-" + Date.now(),
        target: { pixelsPerCm: 3 }, // 1cm = 3pxのスケールで描画
        groups: [
            { id: "G-1", name: "G1", shots: [], mpi: { x: 0, y: 0 } }
        ]
    };
    let currentGroupId = "G-1";

    // --- Canvas設定 ---
    const canvas = document.getElementById('targetCanvas');
    const ctx = canvas.getContext('2d');
    
    // 描画状態（パンとズーム）
    let transform = { scale: 1, offsetX: 0, offsetY: 0 };
    let isDragging = false;
    let lastTouch = { x: 0, y: 0 };
    let initialPinchDistance = null;
    let initialScale = 1;

    // キャンバスのリサイズ処理
    function resizeCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        // 初期状態を的の中心に
        transform.offsetX = canvas.width / 2;
        transform.offsetY = canvas.height / 2;
        draw();
    }
    window.addEventListener('resize', resizeCanvas);

    // --- 描画ロジック ---
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        // パンとズームの適用
        ctx.translate(transform.offsetX, transform.offsetY);
        ctx.scale(transform.scale, transform.scale);

        // 1. 的の描画 (プリセット: 120cm, 80cm, 40cmの円)
        const ppc = sessionData.target.pixelsPerCm;
        const radii = [60, 40, 20];
        
        ctx.lineWidth = 1 / transform.scale; // ズームしても線の太さを一定に
        ctx.strokeStyle = '#333';

        radii.forEach(r => {
            ctx.beginPath();
            ctx.arc(0, 0, r * ppc, 0, Math.PI * 2);
            ctx.stroke();
        });

        // 十字線
        ctx.beginPath();
        ctx.moveTo(0, -70 * ppc); ctx.lineTo(0, 70 * ppc);
        ctx.moveTo(-70 * ppc, 0); ctx.lineTo(70 * ppc, 0);
        ctx.stroke();

        // 2. 弾痕の描画 (現在のグループのみ表示)
        const currentGroup = sessionData.groups.find(g => g.id === currentGroupId);
        if (currentGroup) {
            currentGroup.shots.forEach((shot, index) => {
                const px = shot.x * ppc;
                const py = -shot.y * ppc; // Y軸は画面上では下方向がプラスなため反転

                ctx.beginPath();
                ctx.arc(px, py, 4 / transform.scale, 0, Math.PI * 2);
                ctx.fillStyle = 'red';
                ctx.fill();
                
                // 番号
                ctx.fillStyle = '#000';
                ctx.font = `${12 / transform.scale}px sans-serif`;
                ctx.fillText(index + 1, px + (6 / transform.scale), py - (6 / transform.scale));
            });

            // MPI (平均弾着点) の表示 (✕マーク)
            if (currentGroup.shots.length > 0) {
                const mpiPx = currentGroup.mpi.x * ppc;
                const mpiPy = -currentGroup.mpi.y * ppc;
                const size = 6 / transform.scale;
                
                ctx.beginPath();
                ctx.moveTo(mpiPx - size, mpiPy - size); ctx.lineTo(mpiPx + size, mpiPy + size);
                ctx.moveTo(mpiPx + size, mpiPy - size); ctx.lineTo(mpiPx - size, mpiPy + size);
                ctx.strokeStyle = 'blue';
                ctx.lineWidth = 2 / transform.scale;
                ctx.stroke();
            }
        }
        ctx.restore();
    }

    // --- インタラクション (パン・ズーム) ---
    // マウス操作
    canvas.addEventListener('mousedown', e => {
        isDragging = true;
        lastTouch = { x: e.clientX, y: e.clientY };
    });
    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('mousemove', e => {
        if (!isDragging) return;
        transform.offsetX += e.clientX - lastTouch.x;
        transform.offsetY += e.clientY - lastTouch.y;
        lastTouch = { x: e.clientX, y: e.clientY };
        draw();
    });
    canvas.addEventListener('wheel', e => {
        e.preventDefault();
        const zoomRate = 1.1;
        transform.scale *= (e.deltaY < 0) ? zoomRate : (1 / zoomRate);
        transform.scale = Math.max(0.2, Math.min(transform.scale, 5)); // 制限
        draw();
    });

    // タッチ操作（スマホ用）
    canvas.addEventListener('touchstart', e => {
        if (e.touches.length === 1) {
            isDragging = true;
            lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        } else if (e.touches.length === 2) {
            isDragging = false;
            initialPinchDistance = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
            initialScale = transform.scale;
        }
    });
    canvas.addEventListener('touchmove', e => {
        e.preventDefault(); // スクロール防止
        if (isDragging && e.touches.length === 1) {
            transform.offsetX += e.touches[0].clientX - lastTouch.x;
            transform.offsetY += e.touches[0].clientY - lastTouch.y;
            lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            draw();
        } else if (e.touches.length === 2) {
            const currentDistance = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
            const ratio = currentDistance / initialPinchDistance;
            transform.scale = initialScale * ratio;
            draw();
        }
    });
    canvas.addEventListener('touchend', () => isDragging = false);

    document.getElementById('btn-reset-view').addEventListener('click', () => {
        transform.scale = 1;
        transform.offsetX = canvas.width / 2;
        transform.offsetY = canvas.height / 2;
        draw();
    });

    // --- データ管理ロジック ---
    function calcMPI(group) {
        if (group.shots.length === 0) return { x: 0, y: 0 };
        let sumX = 0, sumY = 0;
        group.shots.forEach(s => { sumX += s.x; sumY += s.y; });
        group.mpi = { 
            x: Math.round((sumX / group.shots.length) * 10) / 10, 
            y: Math.round((sumY / group.shots.length) * 10) / 10 
        };
    }

    function updateUI() {
        // タブの更新
        const tabsContainer = document.getElementById('group-tabs-container');
        tabsContainer.innerHTML = '';
        sessionData.groups.forEach(g => {
            const btn = document.createElement('button');
            btn.className = `group-tab ${g.id === currentGroupId ? 'active' : ''}`;
            btn.textContent = g.name;
            btn.onclick = () => { currentGroupId = g.id; updateUI(); };
            tabsContainer.appendChild(btn);
        });
        
        // 追加ボタン (簡易的にタブの最後に追加)
        const addBtn = document.createElement('button');
        addBtn.className = 'group-tab';
        addBtn.textContent = '＋ 追加';
        addBtn.onclick = () => {
            const newId = `G-${sessionData.groups.length + 1}`;
            sessionData.groups.push({ id: newId, name: `G${sessionData.groups.length + 1}`, shots: [], mpi: { x: 0, y: 0 } });
            currentGroupId = newId;
            updateUI();
        };
        tabsContainer.appendChild(addBtn);

        // リストの更新
        const currentGroup = sessionData.groups.find(g => g.id === currentGroupId);
        const listContainer = document.getElementById('data-list-container');
        listContainer.innerHTML = '';
        
        currentGroup.shots.forEach((s, idx) => {
            listContainer.innerHTML += `<div class="data-row">
                <span>No.${idx + 1}</span>
                <span>X: ${s.x} / Y: ${s.y}</span>
            </div>`;
        });
        
        if(currentGroup.shots.length > 0) {
            listContainer.innerHTML += `<div class="data-row mpi-row">
                <span>平均弾着点 (MPI)</span>
                <span>X: ${currentGroup.mpi.x} / Y: ${currentGroup.mpi.y}</span>
            </div>`;
        } else {
            listContainer.innerHTML += `<div class="data-row">弾痕データがありません</div>`;
        }

        draw();
    }

    // 数値入力での追加
    document.getElementById('btn-add-shot').addEventListener('click', () => {
        const xInput = document.getElementById('input-x').value;
        const yInput = document.getElementById('input-y').value;
        if (xInput === '' || yInput === '') return;

        const currentGroup = sessionData.groups.find(g => g.id === currentGroupId);
        currentGroup.shots.push({ x: parseFloat(xInput), y: parseFloat(yInput) });
        
        // 入力欄リセット
        document.getElementById('input-x').value = '';
        document.getElementById('input-y').value = '';
        
        calcMPI(currentGroup);
        updateUI();
    });

    // 初期化
    resizeCanvas();
    updateUI();

    // PWA Service Worker 登録
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('SW registered!', reg))
        .catch(err => console.error('SW register failed:', err));
    }
</script>

</body>
</html>
